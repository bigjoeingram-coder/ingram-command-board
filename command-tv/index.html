<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>INGRAM OS — TV Command Center</title>
<style>
:root{--bg:#080b0f;--card:#14181e;--card2:#10151b;--line:#252b35;--dim:#9aa4b2;--txt:#f4f7fb;--amber:#ffb020;--red:#ff5147;--blue:#4aa3ff;--green:#36d47e;--violet:#b48cff;--cyan:#4dd9ff}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:radial-gradient(circle at 10% 0%,rgba(74,163,255,.16),transparent 28vw),radial-gradient(circle at 90% 12%,rgba(54,212,126,.11),transparent 24vw),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:2vw 2.4vw;display:flex;flex-direction:column;gap:1vw;animation:screenDrift 90s linear infinite alternate}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--line);padding-bottom:1vw}.brand{font-size:2.55vw;font-weight:900;letter-spacing:-.04em}.brand span{color:var(--blue)}.stamp{text-align:right;color:var(--dim);font-size:1.05vw;line-height:1.45}.stamp b{color:var(--txt)}.launch{background:linear-gradient(135deg,#182330,#14181e 58%,#0f141a);border:1px solid var(--line);border-left:.45vw solid var(--amber);border-radius:1vw;padding:1vw 1.2vw;display:grid;grid-template-columns:.7fr 2.2fr;gap:1vw;min-height:19vh}.launch h1{font-size:1.75vw;line-height:1.05;margin-bottom:.35vw}.date{font-size:3.15vw;font-weight:950;color:var(--amber);line-height:.95}.status{margin-top:.55vw;color:var(--dim);font-size:1.05vw;line-height:1.3}.pacing{display:grid;grid-template-columns:repeat(5,1fr);gap:.62vw}.pace{border:1px solid var(--line);border-radius:.7vw;background:rgba(255,255,255,.035);padding:.68vw;position:relative;overflow:hidden}.pace:after{content:"";position:absolute;left:-70%;top:0;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:sheen 12s linear infinite}.pace b{display:block;font-size:.88vw;text-transform:uppercase;color:var(--dim);margin-bottom:.25vw}.pace span{display:inline-block;margin-bottom:.35vw;font-size:.9vw;font-weight:950}.pace p{font-size:.9vw;color:var(--txt);line-height:1.25}.Pacing{color:var(--green)}.Behind,.At-risk{color:var(--red)}.Overnight{color:var(--violet)}.grid{display:grid;grid-template-columns:.7fr 1fr;grid-template-rows:1fr 1fr;gap:1vw;flex:1;min-height:0}.card{background:rgba(20,24,30,.94);border:1px solid var(--line);border-radius:1vw;padding:1.15vw 1.3vw;display:flex;flex-direction:column;min-height:0;box-shadow:0 1.5vw 4vw rgba(0,0,0,.18)}.card h2{font-size:1.25vw;font-weight:900;letter-spacing:.03em;text-transform:uppercase;margin-bottom:.65vw;display:flex;align-items:center;gap:.55vw}.dot{width:.9vw;height:.9vw;border-radius:50%;flex-shrink:0;box-shadow:0 0 1.2vw currentColor}.d-amber{background:var(--amber);color:var(--amber)}.d-red{background:var(--red);color:var(--red)}.d-blue{background:var(--blue);color:var(--blue)}.d-green{background:var(--green);color:var(--green)}.row{font-size:1.1vw;line-height:1.38;padding:.42vw 0;border-bottom:1px solid var(--line);display:flex;gap:.65vw}.row:last-child{border-bottom:none}.row .n{font-weight:900;color:var(--amber);min-width:1.55vw}.card.rev .row .n{color:var(--red)}.card.mot .row .who{color:var(--blue);font-weight:900;min-width:4.2vw;display:inline-block}.systems-card{position:relative}.sys-cycle{position:relative;flex:1;min-height:0}.sys-screen{position:absolute;inset:0;display:grid;align-content:start;gap:.7vw;opacity:0;transform:translateY(1vw);transition:opacity .7s ease,transform .7s ease}.sys-screen.active{opacity:1;transform:translateY(0)}.sys{display:flex;flex-wrap:wrap;gap:.8vw;font-size:1.05vw}.sys span{display:flex;align-items:center;gap:.42vw}.ok{color:var(--green);font-weight:900}.metric{display:grid;grid-template-columns:1fr auto;gap:.5vw;border-bottom:1px solid var(--line);padding:.5vw 0;font-size:1.05vw}.metric b{color:var(--txt)}.metric span{color:var(--dim)}.ticker{margin-top:.8vw;border-top:1px solid var(--line);padding-top:.7vw;color:var(--dim);font-size:.95vw;line-height:1.35}.foot{border-top:2px solid var(--line);padding-top:.75vw;display:flex;justify-content:space-between;color:var(--dim);font-size:.95vw;gap:1vw}.foot b{color:var(--txt)}.flag{color:var(--blue);font-weight:800}.err{color:var(--red)}@keyframes sheen{0%{left:-70%}18%,100%{left:120%}}@keyframes screenDrift{0%{background-position:0 0,0 0}100%{background-position:1.2vw .8vw,-1vw .9vw}}@media(max-width:1100px){html,body{overflow:auto}.launch,.grid{grid-template-columns:1fr;grid-template-rows:auto}.pacing{grid-template-columns:1fr 1fr}.brand{font-size:30px}.date{font-size:40px}.row{font-size:16px}.card h2{font-size:17px}.pace p,.pace b,.pace span,.stamp,.status{font-size:13px}}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">INGRAM OS — <span>Command Center</span></div>
    <div class="stamp">Snapshot — <b id="updated">loading...</b><br>TV board rotates sections every 12 seconds</div>
  </div>
  <section class="launch">
    <div><h1 id="launchName">August 10 Revenue Launch</h1><div class="date" id="launchDate">Aug 10</div><p class="status" id="launchStatus">Loading launch pacing...</p></div>
    <div class="pacing" id="launchPacing"></div>
  </section>
  <div class="grid">
    <div class="card"><h2><span class="dot d-amber"></span>Needs Joe</h2><div id="needsJoe"></div></div>
    <div class="card rev"><h2><span class="dot d-red"></span>Revenue Blocked</h2><div id="revenueBlocked"></div></div>
    <div class="card mot"><h2><span class="dot d-blue"></span>In Motion — Next Moves</h2><div id="inMotion"></div></div>
    <div class="card systems-card"><h2><span class="dot d-green"></span>Systems / Rotation</h2><div class="sys-cycle"><div class="sys-screen active" id="systemsScreen"></div><div class="sys-screen" id="launchScreen"></div><div class="sys-screen" id="overnightScreen"></div></div></div>
  </div>
  <div class="foot"><div>Flagship: <span class="flag">I² Performance Diagnostic</span> → <b>SalesGenius.FYI</b></div><div id="clock">--</div></div>
<script>
var DATA_VERSION='20260804-tv-1207';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stateClass(s){s=String(s||'').split(' ')[0].replace(/[^a-zA-Z-]/g,'');return s||'Pacing';}
function renderLaunch(d){var l=d.launch||{};document.getElementById('launchName').textContent=l.name||'August 10 Revenue Launch';document.getElementById('launchDate').textContent=l.deadline==='2026-08-10'?'Aug 10':(l.deadline||'Aug 10');document.getElementById('launchStatus').textContent=l.status||l.focus||'';document.getElementById('launchPacing').innerHTML=(l.pacing||[]).map(function(i){var c=stateClass(i.state);return '<article class="pace"><b>'+esc(i.lane)+'</b><span class="'+c+'">'+esc(i.state)+'</span><p>'+esc(i.next)+'</p></article>';}).join('')||'<article class="pace"><p>No launch pacing loaded.</p></article>';}
function renderRotators(d){var systems=(d.systems||[]).map(function(s){return '<span><span class="ok">✓</span> '+esc(s)+'</span>';}).join('');document.getElementById('systemsScreen').innerHTML='<div class="sys">'+systems+'</div><p class="ticker">'+esc(d.parked||'No parked status loaded')+'</p>';var p=(d.launch&&d.launch.pacing)||[];document.getElementById('launchScreen').innerHTML=p.map(function(i){return '<div class="metric"><b>'+esc(i.lane)+'</b><span>'+esc(i.state)+'</span></div>';}).join('')+'<p class="ticker">Focus: '+esc((d.launch&&d.launch.focus)||'Protect launch execution.')+'</p>';document.getElementById('overnightScreen').innerHTML='<div class="metric"><b>LotSocial</b><span>Overnight candidate</span></div><div class="metric"><b>Boundary</b><span>No public launch</span></div><div class="metric"><b>Output</b><span>Repo/build plan + blockers</span></div><p class="ticker">Build work can continue overnight; publishing, selling, ads, emails, and DMs remain blocked until Joe approval.</p>';}
function render(d){document.getElementById('updated').textContent=d.updated||'unknown';renderLaunch(d);document.getElementById('needsJoe').innerHTML=(d.needsJoe||[]).map(function(i){return '<div class="row"><span class="n">'+esc(i.n)+'</span><span>'+esc(i.text)+'</span></div>';}).join('')||'<div class="row"><span>None.</span></div>';document.getElementById('revenueBlocked').innerHTML=(d.revenueBlocked||[]).map(function(t){return '<div class="row"><span class="n">•</span><span>'+esc(t)+'</span></div>';}).join('')||'<div class="row"><span>None.</span></div>';document.getElementById('inMotion').innerHTML=(d.inMotion||[]).map(function(i){return '<div class="row"><span class="who">'+esc(i.who)+'</span><span>'+esc(i.text)+'</span></div>';}).join('')||'<div class="row"><span>None.</span></div>';renderRotators(d)}
function load(){fetch('../data.json?v='+DATA_VERSION+'&t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(render).catch(function(e){document.getElementById('updated').innerHTML='<span class="err">data load failed ('+esc(e.message)+')</span>';});}
var screenIndex=0;function rotate(){var screens=[document.getElementById('systemsScreen'),document.getElementById('launchScreen'),document.getElementById('overnightScreen')];screens.forEach(function(s,i){s.classList.toggle('active',i===screenIndex)});screenIndex=(screenIndex+1)%screens.length}function tick(){document.getElementById('clock').textContent=new Date().toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}
load();tick();setInterval(load,15*60*1000);setInterval(rotate,12000);setInterval(tick,30000);
</script>
</body>
</html>
