<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>INGRAM OS TV Command Center</title><style>:root{--bg:#080b0f;--card:#14181e;--line:#252b35;--dim:#9aa4b2;--txt:#f4f7fb;--amber:#ffb020;--red:#ff5147;--blue:#4aa3ff;--green:#36d47e;--violet:#b48cff}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:radial-gradient(circle at 8% 0,rgba(74,163,255,.16),transparent 28vw),radial-gradient(circle at 92% 10%,rgba(54,212,126,.11),transparent 25vw),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:1.35vw 2.05vw 1.15vw;display:flex;flex-direction:column;gap:.72vw;animation:drift 90s linear infinite alternate}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--line);padding-bottom:.75vw}.brand{font-size:2.25vw;font-weight:950;letter-spacing:-.04em}.brand span{color:var(--blue)}.stamp{text-align:right;color:var(--dim);font-size:.86vw;line-height:1.35}.stamp b{color:var(--txt)}.launch{background:linear-gradient(135deg,#182330,#14181e 58%,#0f141a);border:1px solid var(--line);border-left:.42vw solid var(--amber);border-radius:.85vw;padding:.82vw 1vw;display:grid;grid-template-columns:.58fr 2.42fr;gap:.8vw;min-height:15.4vh;max-height:17vh;overflow:hidden}.launch h1{font-size:1.42vw;line-height:1.04;margin-bottom:.25vw}.date{font-size:2.55vw;font-weight:950;color:var(--amber);line-height:.92}.status{margin-top:.38vw;color:var(--dim);font-size:.88vw;line-height:1.22}.pacing{display:grid;grid-template-columns:repeat(5,1fr);gap:.5vw}.pace{border:1px solid var(--line);border-radius:.58vw;background:rgba(255,255,255,.035);padding:.5vw;position:relative;overflow:hidden}.pace:after{content:"";position:absolute;left:-70%;top:0;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:sheen 12s linear infinite}.pace b{display:block;font-size:.7vw;text-transform:uppercase;color:var(--dim);margin-bottom:.18vw}.pace span{display:inline-block;margin-bottom:.22vw;font-size:.72vw;font-weight:950}.pace p{font-size:.78vw;color:var(--txt);line-height:1.18}.Pacing{color:var(--green)}.Behind,.At-risk{color:var(--red)}.Overnight{color:var(--violet)}.grid{display:grid;grid-template-columns:.42fr 1fr;grid-template-rows:.82fr 1.18fr;gap:.72vw;flex:1;min-height:0}.card{background:rgba(20,24,30,.94);border:1px solid var(--line);border-radius:.85vw;padding:.86vw 1vw;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 1.2vw 3vw rgba(0,0,0,.18)}.card h2{font-size:1.02vw;font-weight:900;letter-spacing:.03em;text-transform:uppercase;margin-bottom:.48vw;display:flex;align-items:center;gap:.45vw;flex:0 0 auto}.dot{width:.72vw;height:.72vw;border-radius:50%;flex-shrink:0;box-shadow:0 0 1vw currentColor}.a{background:var(--amber);color:var(--amber)}.r{background:var(--red);color:var(--red)}.b{background:var(--blue);color:var(--blue)}.g{background:var(--green);color:var(--green)}.row{font-size:.91vw;line-height:1.28;padding:.31vw 0;border-bottom:1px solid var(--line);display:flex;gap:.55vw}.row:last-child{border-bottom:none}.row .n{font-weight:900;color:var(--amber);min-width:1.15vw}.rev .row .n{color:var(--red)}.mot .who{color:var(--blue);font-weight:900;min-width:3.65vw;display:inline-block}.mot{grid-column:2/3;grid-row:2/3}.rev{grid-column:2/3;grid-row:1/2}.systems-card{grid-column:1/2;grid-row:2/3}.sys-cycle{position:relative;flex:1;min-height:0;overflow:hidden}.screen{position:absolute;inset:0;display:grid;align-content:start;gap:.46vw;opacity:0;transform:translateY(.8vw);transition:opacity .7s ease,transform .7s ease;overflow:hidden}.screen.on{opacity:1;transform:translateY(0)}.sys{display:flex;flex-wrap:wrap;gap:.62vw;font-size:.88vw}.ok{color:var(--green);font-weight:900}.metric{display:grid;grid-template-columns:1fr auto;gap:.45vw;border-bottom:1px solid var(--line);padding:.34vw 0;font-size:.88vw}.metric span,.ticker{color:var(--dim)}.ticker{margin-top:.5vw;border-top:1px solid var(--line);padding-top:.48vw;font-size:.78vw;line-height:1.25}.foot{border-top:2px solid var(--line);padding-top:.46vw;display:flex;justify-content:space-between;color:var(--dim);font-size:.78vw;line-height:1;flex:0 0 auto}.flag{color:var(--blue);font-weight:800}@keyframes sheen{0%{left:-70%}18%,100%{left:120%}}@keyframes drift{to{background-position:1.2vw .8vw,-1vw .9vw}}@media(max-width:1100px){html,body{overflow:auto}.launch,.grid{grid-template-columns:1fr;grid-template-rows:auto}.pacing{grid-template-columns:1fr 1fr}.brand{font-size:30px}.date{font-size:40px}.row{font-size:16px}.card h2{font-size:17px}.pace p,.pace b,.pace span,.stamp,.status{font-size:13px}}</style></head><body><div class="top"><div class="brand">INGRAM OS — <span>Command Center</span></div><div class="stamp">Snapshot — <b id="updated">loading...</b><br>TV board rotates sections every 12 seconds</div></div><section class="launch"><div><h1 id="launchName">August 10 Revenue Launch</h1><div class="date" id="launchDate">Aug 10</div><p class="status" id="launchStatus">Loading launch pacing...</p></div><div class="pacing" id="launchPacing"></div></section><div class="grid"><div class="card"><h2><span class="dot a"></span>Needs Joe</h2><div id="needsJoe"></div></div><div class="card rev"><h2><span class="dot r"></span>Revenue Blocked</h2><div id="revenueBlocked"></div></div><div class="card mot"><h2><span class="dot b"></span>In Motion — Next Moves</h2><div id="inMotion"></div></div><div class="card systems-card"><h2><span class="dot g"></span>Systems / Rotation</h2><div class="sys-cycle"><div class="screen on" id="systemsScreen"></div><div class="screen" id="launchScreen"></div><div class="screen" id="overnightScreen"></div></div></div></div><div class="foot"><div>Flagship: <span class="flag">I² Performance Diagnostic</span> → <b>SalesGenius.FYI</b></div><div id="clock">--</div></div><script>var DATA_VERSION='20260804-tv-tight-1240';function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function cls(s){return String(s||'').split(' ')[0].replace(/[^a-zA-Z-]/g,'')||'Pacing'}function launch(d){var l=d.launch||{};launchName.textContent=l.name||'August 10 Revenue Launch';launchDate.textContent=l.deadline==='2026-08-10'?'Aug 10':l.deadline||'Aug 10';launchStatus.textContent=l.status||l.focus||'';launchPacing.innerHTML=(l.pacing||[]).map(function(i){var c=cls(i.state);return '<article class="pace"><b>'+esc(i.lane)+'</b><span class="'+c+'">'+esc(i.state)+'</span><p>'+esc(i.next)+'</p></article>'}).join('')||'<article class="pace"><p>No pacing loaded.</p></article>'}function rot(d){systemsScreen.innerHTML='<div class="sys">'+(d.systems||[]).map(function(s){return '<span><span class="ok">✓</span> '+esc(s)+'</span>'}).join('')+'</div><p class="ticker">'+esc(d.parked||'No parked status loaded')+'</p>';var p=d.launch&&d.launch.pacing||[];launchScreen.innerHTML=p.map(function(i){return '<div class="metric"><b>'+esc(i.lane)+'</b><span>'+esc(i.state)+'</span></div>'}).join('')+'<p class="ticker">Focus: '+esc(d.launch&&d.launch.focus||'Protect launch execution.')+'</p>';overnightScreen.innerHTML='<div class="metric"><b>LotSocial</b><span>Overnight candidate</span></div><div class="metric"><b>Boundary</b><span>No public launch</span></div><div class="metric"><b>Output</b><span>Repo/build plan + blockers</span></div><p class="ticker">Build can continue overnight; publishing, selling, ads, emails, and DMs remain blocked until Joe approval.</p>'}function render(d){updated.textContent=d.updated||'unknown';launch(d);needsJoe.innerHTML=(d.needsJoe||[]).map(function(i){return '<div class="row"><span class="n">'+esc(i.n)+'</span><span>'+esc(i.text)+'</span></div>'}).join('')||'<div class="row"><span>None.</span></div>';revenueBlocked.innerHTML=(d.revenueBlocked||[]).map(function(t){return '<div class="row"><span class="n">•</span><span>'+esc(t)+'</span></div>'}).join('')||'<div class="row"><span>None.</span></div>';inMotion.innerHTML=(d.inMotion||[]).map(function(i){return '<div class="row"><span class="who">'+esc(i.who)+'</span><span>'+esc(i.text)+'</span></div>'}).join('')||'<div class="row"><span>None.</span></div>';rot(d)}function load(){fetch('data.json?v='+DATA_VERSION+'&t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(r.status);return r.json()}).then(render).catch(function(e){updated.innerHTML='<span style="color:var(--red)">data load failed '+esc(e.message)+'</span>'})}var si=0;function rotate(){var s=[systemsScreen,launchScreen,overnightScreen];s.forEach(function(x,i){x.classList.toggle('on',i===si)});si=(si+1)%s.length}function tick(){clock.textContent=new Date().toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'})}load();tick();setInterval(load,15*60*1000);setInterval(rotate,12000);setInterval(tick,30000)</script></body></html>
