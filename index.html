<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INGRAM OS — Command Board</title>
<style>
:root{--bg:#0b0d10;--card:#15181d;--line:#242832;--dim:#8b93a1;--txt:#f2f4f7;--amber:#ffb020;--red:#ff5247;--blue:#4aa3ff;--green:#33d17a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:2.2vw 2.6vw;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--line);padding-bottom:1.2vw;margin-bottom:1.6vw}
.brand{font-size:2.7vw;font-weight:800;letter-spacing:-.5px}
.brand span{color:var(--blue)}
.stamp{text-align:right;color:var(--dim);font-size:1.15vw;line-height:1.5}
.stamp b{color:var(--txt)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4vw;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.5vw 1.7vw;display:flex;flex-direction:column}
.card h2{font-size:1.5vw;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:1vw;display:flex;align-items:center;gap:.6vw}
.dot{width:1vw;height:1vw;border-radius:50%;flex-shrink:0}
.d-amber{background:var(--amber)}.d-red{background:var(--red)}.d-blue{background:var(--blue)}.d-green{background:var(--green)}
.row{font-size:1.5vw;line-height:1.5;padding:.55vw 0;border-bottom:1px solid var(--line);display:flex;gap:.8vw}
.row:last-child{border-bottom:none}
.row .n{font-weight:800;color:var(--amber);min-width:2.2vw}
.card.rev .row .n{color:var(--red)}
.card.mot .row .who{color:var(--blue);font-weight:700;min-width:4vw;display:inline-block}
.sys{display:flex;flex-wrap:wrap;gap:1vw;font-size:1.35vw}
.sys span{display:flex;align-items:center;gap:.5vw}
.ok{color:var(--green);font-weight:800}
.parked{margin-top:auto;color:var(--dim);font-size:1.2vw;padding-top:.8vw}
.foot{margin-top:1.4vw;border-top:2px solid var(--line);padding-top:1vw;display:flex;justify-content:space-between;color:var(--dim);font-size:1.15vw;flex-wrap:wrap;gap:1vw}
.foot b{color:var(--txt)}
.flag{color:var(--blue);font-weight:700}
.err{color:var(--red);font-size:1.2vw}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">INGRAM OS &mdash; <span>Command Board</span></div>
    <div class="stamp">Snapshot &mdash; <b id="updated">loading&hellip;</b><br>Refreshes hourly while the system is running</div>
  </div>
  <div class="grid">
    <div class="card"><h2><span class="dot d-amber"></span>Needs Joe</h2><div id="needsJoe"></div></div>
    <div class="card rev"><h2><span class="dot d-red"></span>Revenue Blocked</h2><div id="revenueBlocked"></div></div>
    <div class="card mot"><h2><span class="dot d-blue"></span>In Motion &mdash; Next Moves</h2><div id="inMotion"></div></div>
    <div class="card"><h2><span class="dot d-green"></span>Systems</h2><div class="sys" id="systems"></div><div class="parked" id="parked"></div></div>
  </div>
  <div class="foot">
    <div>Flagship: <span class="flag">I&sup2; Performance Diagnostic</span> &rarr; <b>SalesGenius.FYI</b></div>
    <div>Escalate only: Joe decision &middot; revenue blocked &middot; stale/broken &middot; trigger fired &middot; agent stuck</div>
  </div>
<script>
var DATA_VERSION='20260731-2109';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(d){
  document.getElementById('updated').textContent=d.updated||'unknown';
  document.getElementById('needsJoe').innerHTML=(d.needsJoe||[]).map(function(i){return '<div class="row"><span class="n">'+esc(i.n)+'</span><span>'+esc(i.text)+'</span></div>';}).join('')||'<div class="row"><span>None.</span></div>';
  document.getElementById('revenueBlocked').innerHTML=(d.revenueBlocked||[]).map(function(t){return '<div class="row"><span class="n">&bull;</span><span>'+esc(t)+'</span></div>';}).join('')||'<div class="row"><span>None.</span></div>';
  document.getElementById('inMotion').innerHTML=(d.inMotion||[]).map(function(i){return '<div class="row"><span class="who">'+esc(i.who)+'</span><span>'+esc(i.text)+'</span></div>';}).join('')||'<div class="row"><span>None.</span></div>';
  document.getElementById('systems').innerHTML=(d.systems||[]).map(function(s){return '<span><span class="ok">&#x2713;</span> '+esc(s)+'</span>';}).join('');
  document.getElementById('parked').innerHTML=d.parked?('Parked: '+esc(d.parked)):'';
}
function load(){
  fetch('data.json?v='+DATA_VERSION+'&t='+Date.now(),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(render)
    .catch(function(e){document.getElementById('updated').innerHTML='<span class="err">data load failed ('+esc(e.message)+')</span>';});
}
load();
setInterval(load, 15*60*1000);
</script>
</body>
</html>
